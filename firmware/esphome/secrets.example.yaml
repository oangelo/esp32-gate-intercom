# Copy this file to secrets.yaml (which is git-ignored) and fill in your own values.
# Nothing in this example is a real credential.

# 2.4 GHz network only: the ESP32-S3 has no 5 GHz radio
wifi_ssid: "your-2.4ghz-ssid"
wifi_password: "your-wifi-password"

# Fallback access point, used when the device cannot join the network
ap_password: "change-this-too"

# Not used by this project, kept so the example matches the original file
mqtt_password: "not-used"

# ESPHome API encryption key. Generate one with:
#   openssl rand -base64 32
intercom_api_key: "REPLACE_WITH_A_RANDOM_32_BYTE_BASE64_KEY"

# OTA password, used by `esphome run --device <ip>`
intercom_ota_password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
