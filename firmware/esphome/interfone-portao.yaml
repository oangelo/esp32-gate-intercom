# =============================================================================
# Interfone Portão — v2: stack intercom_api + i2s_audio_duplex + esp_aec
# =============================================================================
# Fork: github.com/samuelthng/intercom-api @ 7d2405272e73326fa333e7c16dbe09f432906e17
#       (fork do n-IA-hane/esphome-intercom, 246 commits à frente do que usávamos)
# Componentes vendorizados em ../vendor/intercom-api (nada de github@main no build).
#
# POR QUE ESTA VERSÃO EXISTE
#   O eco medido em 19/09 (tom de 600 Hz a -10 dBFS voltando pelo mic com pico de
#   -7,7 dB, ~6 dB ACIMA do próprio sinal elétrico, contra piso de -52 dB) é
#   acoplamento alto-falante->mic sem nenhum cancelamento: o i2s_audio_udp mandava
#   para a rede tudo o que o mic ouvia, sempre.
#   Esta placa TEM referência de AEC por hardware: no esquemático oficial (v1.1) o
#   bloco rotulado "AEC" liga OUTP/OUTN do ES8311 (R37/R75 2,2k + filtro) no
#   MIC3P/MIC3N do ES7210. Com o ES7210 em TDM, o canal MIC3 é a referência
#   sample-aligned do que está tocando — o melhor tipo de referência que existe.
#   O driver do ESPHome fixa enable_tdm_=false, então os registradores de TDM são
#   escritos à mão no on_boot (priority 200 = depois do setup do ES7210, 600).
#
# O QUE MUDOU EM RELAÇÃO AO YAML ANTERIOR (i2s_audio_udp + go2rtc)
#   - o áudio NÃO passa mais por UDP/go2rtc/WebRTC: o ESP é servidor TCP na 6054
#     (protocolo em intercom_protocol.h; PCM s16le 16 kHz mono, 512 amostras/chunk)
#   - o microfone entregue ao intercom é o mic_aec (PÓS-cancelamento); existe
#     também o mic_raw (pré-AEC) para diagnóstico
#   - VA (voice assistant) e wake word FORAM CORTADOS de propósito: wake word no
#     portão acorda com barulho de rua e consome CPU/flash que o AEC precisa
#   - pipeline de fala: 48 kHz no barramento I2S (rate nativo dos dois codecs),
#     com decimação FIR x3 para 16 kHz no mic/AEC
#   - os contadores "Pacotes Enviados/Recebidos" e o "Modo de Audio" NÃO existem
#     mais (eram do componente antigo) — o painel do HA precisa ser ajustado
#
# ROLLBACK (uma linha, por OTA)
#   esphome upload interfone-portao.yaml --device <intercom-ip>   # o YAML antigo
#   continua intacto neste diretório; o build dele também continua no .esphome/
#
# PENDÊNCIAS CONHECIDAS
#   1) RESOLVIDO (19/09): o esp-sr 2.3.0 NÃO tem os modos fd_low_cost/fd_high_perf nem
#      API de NLP — as opções fd_* saíram do select (com elas o aec_create falha e cai fora).
#   2) RESOLVIDO (19/09): o modo é o que decide o eco. sr_low_cost não cancela nada
#      (~0 dB, e o filtro fica instável: -78 dB numa rodada, -52 na outra);
#      voip_low_cost cancela 47,3 dB. O firmware sobe em voip_low_cost (initial_option).
#   3) O select de AEC reinicia o caminho de áudio (stop/start do i2s_duplex) — é o
#      caminho mais delicado do componente; trocar modo com a placa ociosa.
#   4) O envio do intercom_api trunca mensagem quando o socket aperta (`send_message_`
#      desiste no timeout de 20 ms e o protocolo não tem magic/CRC): o cliente
#      desalinha. O harness resincroniza, mas o card do HA pode sofrer em rede ruim —
#      ainda não medido no card.
#   5) Ganho do mic está em 0 dB (number runtime); o ES7210 do stack antigo usava 24 dB.
#      Só subir com medição: mexe na convergência do AEC e no nível de voz.
# =============================================================================

substitutions:
  name: interfone-portao
  friendly_name: Interfone Portao

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.2.0
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    # priority 200 roda DEPOIS do setup do ES7210 (600): o driver do ESPHome fixa
    # enable_tdm_=false e sobra para nós ligar o TDM e o ganho do MIC3.
    priority: 200
    then:
      - switch.turn_on: speaker_enable
      - delay: 200ms
      # A escrita dos registradores de TDM do ES7210 (MIC3 como referencia) saiu
      # deste arquivo: com `use_tdm_reference: false` o ES7210 tem de ficar no
      # modo I2S padrao do ESPHome. O valor de referencia que se provou util e' o
      # buffer de delay do proprio componente. Medicao de 19/09 que motivou a
      # troca: com TDM ligado o eco nao caia (e o stream ainda desincronizava por
      # carga de CPU); ver o cabeçalho e o A/B em tools/interfone_aec_ab.py.
      # Sincroniza o volume do ES8311 com o number "Speaker Volume"
      - lambda: |-
          float vol = 0.15 + (id(speaker_volume).state / 100.0) * 0.60;
          id(es8311_dac).set_volume(vol);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # Rollback do bootloader: um build que crashe antes do WiFi volta sozinho
      # para o slot anterior (aprendido na marra em 19/09 — conferir SEMPRE o
      # compilation_time depois do OTA).
      CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret intercom_api_key
  services:
    # Mesmo "kick" do on_streaming, mas sob demanda: reescreve o volume do ES8311
    # e desmuta, sem precisar de chamada. Serve para testar o alto-falante.
    - service: kick_dac
      then:
        - lambda: |-
            float vol = 0.15 + (id(speaker_volume).state / 100.0) * 0.60;
            id(es8311_dac).set_volume(vol);
        - audio_dac.mute_off: es8311_dac
        - logger.log: "ES8311: volume reescrito + unmute (kick_dac)"
    - service: codec_dump
      then:
        - lambda: |-
            uint8_t r00 = 0, r01 = 0, r12 = 0, r45 = 0, r46 = 0, r4b = 0;
            id(es7210_adc).read_byte(0x00, &r00);
            id(es7210_adc).read_byte(0x01, &r01);
            id(es7210_adc).read_byte(0x12, &r12);
            id(es7210_adc).read_byte(0x45, &r45);
            id(es7210_adc).read_byte(0x46, &r46);
            id(es7210_adc).read_byte(0x4B, &r4b);
            ESP_LOGI("codec_dump", "ES7210: 00=0x%02X 01=0x%02X 12=0x%02X 45=0x%02X 46=0x%02X 4B=0x%02X",
                     r00, r01, r12, r45, r46, r4b);
  on_client_connected:
    - lambda: |-
        id(intercom).publish_entity_states();

ota:
  - platform: esphome
    password: !secret intercom_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 15min
  ap:
    ssid: "Interfone Portao Fallback"
    password: !secret ap_password

captive_portal:

external_components:
  # Vendorizado e pinado (ver vendor/INTERCOM_API_COMMIT). Preferimos local a
  # `github://` para o build não depender de rede nem mudar sozinho.
  - source:
      type: local
      path: ../vendor/intercom-api
    components: [intercom_api, i2s_audio_duplex, esp_aec]

# =============================================================================
# I2C (barramento compartilhado) + expansor TCA9555
# =============================================================================
i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO10
    scan: true

tca9555:
  - id: io_expander
    address: 0x20
    i2c_id: internal_i2c

# =============================================================================
# Codecs — aqui só inicialização I2C; o I2S é do i2s_audio_duplex
# =============================================================================
audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 48000          # acompanha o barramento
    use_mclk: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: internal_i2c
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 48000          # acompanha o barramento
    mic_gain: 24dB              # MIC1/MIC2; o MIC3 é ajustado no lambda do boot

# =============================================================================
# AEC (ESP-SR) — linear + filtro adaptativo; modo trocável em runtime
# =============================================================================
esp_aec:
  id: aec_processor
  sample_rate: 16000            # AEC sempre em 16 kHz
  # MEDIDO em 19/09 (A/B intercalado, tom 600 Hz, mesmo estimulo):
  #   sr_low_cost   -> ~0 dB de supressao (filtro instavel: -78 numa rodada, -52 na outra)
  #   voip_low_cost -> 47,3 dB de supressao, estavel, 0 resync
  # Este e' o modo que o componente cria no boot; tem de casar com o initial_option
  # do select "AEC Mode", senao o painel mostra um modo e o AEC roda outro.
  mode: voip_low_cost
  filter_length: 4              # ~64 ms de cauda de eco

i2s_audio_duplex:
  id: i2s_duplex
  i2s_lrclk_pin: GPIO14
  i2s_bclk_pin: GPIO13
  i2s_mclk_pin: GPIO12
  i2s_din_pin: GPIO15           # do ES7210 (ADC)
  i2s_dout_pin: GPIO16          # para o ES8311 (DAC)
  sample_rate: 48000            # barramento no rate nativo dos codecs
  output_sample_rate: 16000     # mic/AEC em 16 kHz via FIR x3
  aec_id: aec_processor
  # Referencia do AEC = BUFFER DE DELAY do proprio componente (caminho generico,
  # sem depender do codec). O caminho TDM/MIC3 ficou desligado em 19/09: com ele o
  # eco nao caia nada no A/B e o stream desincronizava (CPU extra sem beneficio).
  use_tdm_reference: false
  aec_reference_delay_ms: 80    # atraso entre escrever no I2S e o eco voltar no mic
  buffers_in_psram: true        # os frames de 512 amostras não cabem na RAM interna

# =============================================================================
# Microfone e alto-falante
# =============================================================================
microphone:
  - platform: i2s_audio_duplex
    id: mic_aec                    # PÓS-AEC: é este que vai para a rede

speaker:
  - platform: i2s_audio_duplex
    id: hw_speaker
    i2s_audio_duplex_id: i2s_duplex
    sample_rate: 48000

  # Sem mixer: o mixer do ESPHome exige 2 fontes ou mais e aqui só existe o
  # interfone (VA/TTS/mídia foram cortados). O resampler fala direto com o I2S.
  - platform: resampler
    id: intercom_speaker            # 16 kHz da rede -> 48 kHz do barramento
    output_speaker: hw_speaker
    task_stack_in_psram: true

# =============================================================================
# Interfone
# =============================================================================
intercom_api:
  id: intercom
  mode: full
  microphone: mic_aec
  speaker: intercom_speaker
  ringing_timeout: 30s
  on_outgoing_call:
    - homeassistant.event:
        event: esphome.intercom_call
        data:
          caller: !lambda 'return App.get_friendly_name();'
          destination: "Home Assistant"
          type: "doorbell"
  on_streaming:
    - logger.log: "Interfone: chamada em andamento"
    # KICK DO ES8311. O codec e' inicializado no setup() do audio_dac, quando o
    # MCLK do I2S ainda nao existe, e neste board isso o deixa MUDO (mesma
    # armadilha documentada no stack antigo em 18/09: pipeline limpo, log limpo,
    # e silencio). Reescrever volume + unmute com o I2S ja' no ar e' o que faz
    # sair som — sem isso a chamada chega em STREAMING e nao se ouve nada.
    - lambda: |-
        float vol = 0.15 + (id(speaker_volume).state / 100.0) * 0.60;
        id(es8311_dac).set_volume(vol);
    - audio_dac.mute_off: es8311_dac
    - logger.log: "Interfone: ES8311 com volume reescrito + unmute"
  on_idle:
    - logger.log: "Interfone: ocioso"

# =============================================================================
# Controles
# =============================================================================
switch:
  # Amplificador (NS4150B): o PA_CTRL está no EXIO8 do TCA9555, não em GPIO.
  - platform: gpio
    id: speaker_enable
    name: "Amplificador"
    icon: "mdi:amplifier"
    pin:
      tca9555: io_expander
      number: 8
      mode: output
    restore_mode: ALWAYS_ON

  - platform: intercom_api
    intercom_api_id: intercom
    auto_answer:
      id: auto_answer_switch
      name: "Auto Answer"
      icon: mdi:phone-in-talk
      restore_mode: RESTORE_DEFAULT_ON   # portão atende sozinho

  - platform: i2s_audio_duplex
    i2s_audio_duplex_id: i2s_duplex
    aec:
      id: aec_switch
      name: "Echo Cancellation"
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: i2s_audio_duplex
    i2s_audio_duplex_id: i2s_duplex
    mic_gain:
      name: "Mic Gain"

  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: "mdi:volume-high"
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          float es8311_vol = 0.15 + (x / 100.0) * 0.60;
          id(es8311_dac).set_volume(es8311_vol);

select:
  # Instrumento de A/B: troca o modo do AEC em runtime (reinicia o áudio).
  # Os modos fd_* só funcionam se o esp-sr vendorizado os tiver (ver pendência 1).
  - platform: template
    name: "AEC Mode"
    id: aec_mode_select
    icon: mdi:tune-vertical
    options:
      - "sr_low_cost"
      - "sr_high_perf"
      - "voip_low_cost"
      - "voip_high_perf"
    initial_option: "voip_low_cost"
    optimistic: true
    # restore_value desligado: o modo bom tem de vir do YAML, nao de um experimento
    # que ficou salvo na flash. Medido em 19/09 (A/B intercalado, tom 600 Hz):
    #   sr_low_cost  ->  ~0 dB de supressao (e com filtro instavel: -78 vs -52)
    #   voip_low_cost->  47,3 dB (-118,9 / -104,1 contra -58,9 / -69,5 sem AEC)
    restore_value: false
    set_action:
      - lambda: |-
          int mode = 0;
          if (x == "sr_low_cost") mode = 0;
          else if (x == "sr_high_perf") mode = 1;
          else if (x == "voip_low_cost") mode = 3;
          else if (x == "voip_high_perf") mode = 4;
          else if (x == "fd_low_cost") mode = 5;
          else if (x == "fd_high_perf") mode = 6;
          if (!id(intercom).is_idle()) {
            ESP_LOGW("aec_mode", "chamada ativa: nao troco o modo do AEC agora");
            return;
          }
          id(i2s_duplex).stop();
          if (!id(aec_processor).reinit(static_cast<aec_mode_t>(mode))) {
            ESP_LOGE("aec_mode", "reinit do AEC falhou; voltando ao modo anterior");
          }
          id(i2s_duplex).start();

# =============================================================================
# Campainha e sensores
# =============================================================================
binary_sensor:
  # Mesmo nome/entity_id de antes: a automação de campainha do HA continua válida.
  - platform: gpio
    id: btn_portao
    name: "Botao Portao"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - logger.log: "Campainha: botao do portao pressionado"

text_sensor:
  # Lista de contatos vindos da integração do HA (fica vazia até ela existir).
  - platform: homeassistant
    id: ha_active_devices
    entity_id: sensor.intercom_active_devices
    on_value:
      - intercom_api.set_contacts:
          id: intercom
          contacts_csv: !lambda 'return x;'

sensor:
  - platform: wifi_signal
    name: "Sinal WiFi"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "CPU Temperature"
    update_interval: 60s
    entity_category: diagnostic
